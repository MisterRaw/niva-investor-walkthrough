<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Humber Natural Capital | Compliance Platform Walkthrough</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header class="topbar">
  <div class="brand">
    <img src="assets/humbernaturalcapitallogo1.png" alt="Humber Natural Capital" class="logo-img">
  </div>

  <div class="topbar-actions">
    <button id="btnShare" class="btn secondary">Copy share link</button>
  </div>
</header>


  <main class="layout">
    <aside class="sidebar">
      <h2>Guided Tour</h2>
      <p class="muted">Click a step, or use Next.</p>

      <div class="navbuttons">
        <button id="btnStart" class="btn primary">Start</button>
        <button id="btnNext" class="btn primary">Next</button>
        <button id="btnPrev" class="btn secondary">Back</button>
      </div>

      <nav id="steps" class="steps"></nav>

      <div class="smallprint">
        Public demo. No real client data.
      </div>
    </aside>

    <section class="stage">
      <div class="stage-header">
        <div>
          <h1 id="stageTitle">Compliance Platform Walkthrough</h1>
          <p id="stageSubtitle" class="muted"></p>
        </div>
        <div class="pill" id="stagePill">Step</div>
      </div>

      <div class="stage-body">
        <div class="screen">
          <img id="screenImage" alt="" />
          <div id="screenCustom" class="screen-custom hidden"></div>
          <div id="screenOverlay" class="overlay"></div>
        </div>

        <div class="card">
          <h3 id="cardTitle"></h3>
          <p id="cardBody" class="muted"></p>

          <div class="divider"></div>

          <div class="chips" id="chips"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
